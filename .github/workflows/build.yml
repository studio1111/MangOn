name: Build MangOn extensions

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "src/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mangon-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout MangOn
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: mangon
          persist-credentials: false

      - name: Checkout pinned Keiyoushi build toolchain
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: keiyoushi/extensions-source
          ref: ee661f5233b346559fbdd53993d447c318c5aef0
          path: upstream
          persist-credentials: false

      - name: Overlay MangOn source modules
        run: |
          mkdir -p upstream/src/fa
          cp -a mangon/src/fa/. upstream/src/fa/
          python - <<'PY'
          from pathlib import Path
          settings = Path("upstream/settings.gradle.kts")
          content = settings.read_text()
          old = "loadAllIndividualExtensions()"
          new = 'loadIndividualExtension("fa", "manhwachi")'
          if old not in content:
              raise SystemExit("Keiyoushi settings layout changed")
          settings.write_text(content.replace(old, new, 1))
          PY

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Build and lint
        working-directory: upstream
        run: |
          ./gradlew :src:fa:manhwachi:assembleRelease :src:fa:manhwachi:lintRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mangon-manhwachi-apk
          path: upstream/src/fa/manhwachi/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
