name: Build and publish MangOn Mihon repository

on:
  push:
    branches: ["**"]
    paths:
      - "src/**"
      - ".github/workflows/build.yml"
      - ".github/scripts/**"
  pull_request:
    paths:
      - "src/**"
      - ".github/workflows/build.yml"
      - ".github/scripts/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mangon-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    outputs:
      signing_key: ${{ steps.signing.outputs.signing_key }}
    steps:
      - name: Checkout MangOn
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: mangon
          persist-credentials: false

      - name: Checkout pinned Keiyoushi build toolchain
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: keiyoushi/extensions-source
          ref: ee661f5233b346559fbdd53993d447c318c5aef0
          path: upstream
          persist-credentials: false

      - name: Overlay MangOn source modules
        run: |
          mkdir -p upstream/src/fa
          cp -a mangon/src/fa/. upstream/src/fa/
          python - <<'PY'
          from pathlib import Path
          settings = Path("upstream/settings.gradle.kts")
          content = settings.read_text()
          if "loadAllIndividualExtensions()" not in content:
              raise SystemExit("Keiyoushi settings no longer loads all individual extensions")
          PY

      - name: Set up Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Test Mihon index generator
        run: |
          python -m pip install --disable-pip-version-check --no-input "protobuf==7.35.1"
          python -m unittest discover -s mangon/.github/scripts -p 'test_*.py' -v

      - name: Test Meast chapter and reader parsers
        working-directory: upstream
        run: ./gradlew :src:fa:meast:test --no-daemon --stacktrace

      - name: Configure and verify stable signing key
        if: github.ref == 'refs/heads/main'
        id: signing
        working-directory: upstream
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${SIGNING_KEYSTORE_B64:-}" || { echo "::error::SIGNING_KEYSTORE_B64 is required for publishing"; exit 1; }
          test -n "${KEY_STORE_PASSWORD:-}" || { echo "::error::KEY_STORE_PASSWORD is required for publishing"; exit 1; }
          test -n "${ALIAS:-}" || { echo "::error::ALIAS is required for publishing"; exit 1; }
          test -n "${KEY_PASSWORD:-}" || { echo "::error::KEY_PASSWORD is required for publishing"; exit 1; }
          printf '%s' "$SIGNING_KEYSTORE_B64" | base64 --decode > signingkey.jks
          chmod 600 signingkey.jks
          keytool -list -keystore signingkey.jks -storepass "$KEY_STORE_PASSWORD" -alias "$ALIAS" >/dev/null
          fingerprint="$(keytool -exportcert -keystore signingkey.jks -storepass "$KEY_STORE_PASSWORD" -alias "$ALIAS" | sha256sum | awk '{print tolower($1)}')"
          [[ "$fingerprint" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::Could not derive SHA-256 certificate fingerprint"; exit 1; }
          echo "signing_key=$fingerprint" >> "$GITHUB_OUTPUT"
          echo "Stable signing certificate validated; SHA-256 fingerprint: $fingerprint"

      - name: Build and lint release (PR debug validation)
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
        working-directory: upstream
        run: |
          mapfile -t modules < <(find ../mangon/src/fa -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort)
          tasks=()
          for module in "${modules[@]}"; do
            [[ -f "src/fa/${module}/build.gradle.kts" ]] || continue
            tasks+=(":src:fa:${module}:assembleRelease" ":src:fa:${module}:lintRelease")
          done
          (("${#tasks[@]}" > 0)) || { echo "::error::No Persian extension modules found"; exit 1; }
          printf 'Building and linting %s Persian extension module(s)\n' "$((${#tasks[@]} / 2))"
          ./gradlew "${tasks[@]}" --no-daemon

      - name: Build and lint release (signed publish)
        if: github.ref == 'refs/heads/main'
        working-directory: upstream
        env:
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -s signingkey.jks || { echo "::error::Stable signing keystore is missing from the upstream Gradle root"; exit 1; }
          mapfile -t modules < <(find ../mangon/src/fa -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort)
          tasks=()
          for module in "${modules[@]}"; do
            [[ -f "src/fa/${module}/build.gradle.kts" ]] || continue
            tasks+=(":src:fa:${module}:assembleRelease" ":src:fa:${module}:lintRelease")
          done
          (("${#tasks[@]}" > 0)) || { echo "::error::No Persian extension modules found"; exit 1; }
          printf 'Building and linting %s Persian extension module(s)\n' "$((${#tasks[@]} / 2))"
          ./gradlew "${tasks[@]}" --no-daemon --no-configuration-cache

      - name: Verify APK and extension JAR signatures
        if: github.ref == 'refs/heads/main'
        working-directory: upstream
        env:
          EXPECTED_FINGERPRINT: ${{ steps.signing.outputs.signing_key }}
        run: |
          set -euo pipefail
          mapfile -t apks < <(find src/fa -type f -path '*/build/outputs/apk/release/*.apk' -print | sort)
          mapfile -t jars < <(find src/fa -type f -path '*/build/outputs/jar/release/*.jar' -print | sort)
          [[ "${#apks[@]}" -gt 0 ]] || { echo "::error::No release APKs were built"; exit 1; }
          [[ "${#jars[@]}" -eq "${#apks[@]}" ]] || { echo "::error::APK/JAR count mismatch: ${#apks[@]} APK(s), ${#jars[@]} JAR(s)"; exit 1; }
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$apksigner" || { echo "::error::Android apksigner was not found"; exit 1; }
          python ../mangon/.github/scripts/verify_release_signatures.py \
            --expected "$EXPECTED_FINGERPRINT" \
            --apk "${apks[@]}" \
            --jar "${jars[@]}" \
            --apksigner "$apksigner"

      - name: Upload release bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mangon-release-bundle
          path: |
            upstream/src/fa/*/build/keiyoushi-source-info.json
            upstream/src/fa/*/build/outputs/apk/release/*.apk
            upstream/src/fa/*/build/outputs/jar/release/*.jar
          if-no-files-found: error
          retention-days: 7

      - name: Remove signing keystore from runner
        if: always()
        run: rm -f upstream/signingkey.jks

  publish:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout MangOn
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Download signed release bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mangon-release-bundle
          path: artifacts

      - name: Test and generate Mihon repository index
        env:
          SIGNING_KEY: ${{ needs.build.outputs.signing_key }}
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input "protobuf==7.35.1"
          python -m unittest discover -s .github/scripts -p 'test_*.py' -v
          python .github/scripts/build_mihon_index.py --artifacts-dir artifacts --output-dir dist/repo --signing-key "$SIGNING_KEY"

      - name: Publish static repository branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/mangon-verify
          cp .github/scripts/index_pb2.py /tmp/mangon-verify/index_pb2.py
          cp -a dist/repo /tmp/mangon-publish
          git fetch origin repo || true
          if git show-ref --verify --quiet refs/remotes/origin/repo; then
            git switch -C repo --track origin/repo
          else
            git switch --orphan repo
          fi
          git rm -rf . >/dev/null 2>&1 || true
          git clean -fdx
          cp -a /tmp/mangon-publish/. .
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "Repository index and assets are unchanged."
            exit 0
          fi
          git commit -m "Publish MangOn Mihon repository"
          git push origin HEAD:repo

      - name: Verify hosted Mihon repository and assets
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          base="https://raw.githubusercontent.com/studio1111/MangOn/repo"
          curl --fail --silent --show-error --retry 5 --retry-delay 2 \
            "$base/repo.json?cachebust=$GITHUB_SHA" -o /tmp/repo.json
          curl --fail --silent --show-error --retry 5 --retry-delay 2 \
            "$base/index.pb?cachebust=$GITHUB_SHA" -o /tmp/index.pb
          python - <<'PY'
          import gzip
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path
          sys.path.insert(0, "/tmp/mangon-verify")
          import index_pb2

          descriptor = json.loads(Path("/tmp/repo.json").read_text(encoding="utf-8"))
          assert descriptor["meta"]["name"] == "MangOn"
          assert descriptor["index_v2"] == "https://raw.githubusercontent.com/studio1111/MangOn/repo/index.pb"

          index = index_pb2.Index()
          index.ParseFromString(gzip.decompress(Path("/tmp/index.pb").read_bytes()))
          fingerprint = descriptor["meta"]["signingKeyFingerprint"]
          assert index.name == "MangOn"
          assert index.signingKey == fingerprint and len(fingerprint) == 64
          extensions = list(index.extensionList.extensions)
          packages = {extension.packageName for extension in extensions}
          required_packages = {
              "eu.kanade.tachiyomi.extension.fa.manhwachi",
              "eu.kanade.tachiyomi.extension.fa.mangariom",
              "eu.kanade.tachiyomi.extension.fa.mangabox",
              "eu.kanade.tachiyomi.extension.fa.meast",
          }
          assert required_packages.issubset(packages), f"Missing expected extension packages: {required_packages - packages}"
          assert len(packages) == len(extensions), "Duplicate extension packages in repository index"
          assert all(extension.sources and all(source.language == "fa" for source in extension.sources) for extension in extensions)

          # Mihon's v2 Resources model exposes apkUrl and iconUrl only.
          # Signed JARs are published separately for tooling.
          apk_urls = [extension.resources.apkUrl for extension in extensions]
          assert len(apk_urls) == len(set(apk_urls)), "Duplicate APK URLs in repository index"
          base = "https://raw.githubusercontent.com/studio1111/MangOn/repo"
          for asset_url in apk_urls:
              assert asset_url.startswith(base + "/apk/")
              subprocess.run(
                  ["curl", "--fail", "--silent", "--show-error", "--retry", "5",
                   "--retry-delay", "2", asset_url + "?cachebust=" + os.environ["GITHUB_SHA"],
                   "--output", "/dev/null"],
                  check=True,
              )
          jar_files = sorted(Path("dist/repo/jar").glob("*.jar"))
          assert len(jar_files) == len(extensions), "JAR asset count does not match extension count"
          for jar_file in jar_files:
              subprocess.run(
                  ["curl", "--fail", "--silent", "--show-error", "--retry", "5",
                   "--retry-delay", "2", f"{base}/jar/{jar_file.name}?cachebust=" + os.environ["GITHUB_SHA"],
                   "--output", "/dev/null"],
                  check=True,
              )
          print(f"Hosted repository verified: {len(extensions)} extensions; descriptor, index, all APKs and JARs are reachable.")
          PY
